<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Para Puka 🎂</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- DECORACIÓN -->
    <div class="decoracion">

        <div class="globo globo-rojo"></div>
        <div class="globo globo-azul"></div>
        <div class="globo globo-morado"></div>
        <div class="globo globo-negro"></div>

        <div class="globo globo-rojo grande"></div>
        <div class="globo globo-azul pequeno"></div>

        <div class="estrella estrella1">✦</div>
        <div class="estrella estrella2">✦</div>
        <div class="estrella estrella3">✦</div>

        <div class="corazon">♥</div>
        <div class="corazon azul-corazon">♥</div>
        <div class="corazon morado-corazon">♥</div>

    </div>


    <!-- PORTADA -->
    <div class="contenedor portada">

        <div class="etiqueta">
            ✨ HOY ES UN DÍA ESPECIAL ✨
        </div>

        <div class="emoji-fiesta">
            🎂
        </div>

        <h1>
            ¡Feliz cumpleaños,<br>
            <span>Puka</span>! 🎉
        </h1>

        <p class="mensaje-portada">
            Kevin, tengo una sorpresa preparada especialmente para ti...
        </p>

        <div class="separador">
            ✦ ✦ ✦
        </div>

        <button class="boton-sorpresa" onclick="abrirSorpresa()">
            🎁 Abrir sorpresa
        </button>

        <p class="texto-pequeno">
            Toca el botón para comenzar 👀
        </p>

    </div>


    <script src="script.js"></script>

</body>

</html>
